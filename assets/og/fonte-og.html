<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden}
  .og{
    position:relative;width:1200px;height:630px;overflow:hidden;background:#1F221A;
  }
  .og img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:62% 38%;
    filter:saturate(.55) contrast(1.05);
  }
  .veu{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(24,25,19,.86) 0%, rgba(24,25,19,.60) 42%, rgba(24,25,19,.72) 100%);
  }
  .conteudo{
    position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:0 90px;
  }
  .marca{display:flex;align-items:center;gap:16px;margin-bottom:34px}
  .mono{width:34px;height:auto;display:block}
  .mono rect{fill:#F4EFE6}
  .nome{font:400 26px/1 Arial,Helvetica,sans-serif;letter-spacing:.32em;color:#F4EFE6}
  .titulo{
    font-family:'Prata',Georgia,serif;font-weight:400;
    font-size:52px;line-height:1.22;letter-spacing:-.01em;
    color:#F4EFE6;max-width:15.5em;
    text-shadow:0 2px 20px rgba(0,0,0,.4);
  }
  .linha{
    margin-top:30px;font:400 15px/1 Arial,Helvetica,sans-serif;
    letter-spacing:.26em;text-transform:uppercase;color:rgba(235,224,209,.78);
  }
</style>
<div class="og">
  <img src="../img/hero-arcos.webp" alt="">
  <div class="veu"></div>
  <div class="conteudo">
    <div class="marca">
      <svg class="mono" viewBox="0 0 211 294"><rect x="0" y="0" width="211" height="33"/><rect x="90" y="0" width="33" height="294"/><rect x="155" y="65" width="33" height="207"/><rect x="123" y="151" width="32" height="33"/></svg>
      <span class="nome">TRUEHOPE</span>
    </div>
    <div class="titulo">A família é design divino e o arquiteto ainda edifica.</div>
    <div class="linha">Masterclass · 08 de outubro de 2026</div>
  </div>
</div>
